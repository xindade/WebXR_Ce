<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>VR 热气球托盘场景 - Ak48压缩版</title>
    <style>
        :root { --bg: #1a1a2e; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg); overflow: hidden;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            height: 100vh; width: 100vw;
            user-select: none; -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        canvas { display: block; }
        
        #vr-entry { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 20; }
        #enter-vr-btn {
            display: block; padding: 16px 44px; font-size: 20px; font-weight: 700;
            letter-spacing: 2px; color: #fff;
            background: linear-gradient(135deg, #e94560, #c23152);
            border: none; border-radius: 50px; cursor: pointer;
            transition: all 0.3s ease; box-shadow: 0 8px 30px rgba(233,69,96,0.5);
            text-transform: uppercase; outline: none;
        }
        #enter-vr-btn:hover { background: linear-gradient(135deg, #ff5a7a, #e94560); transform: translateY(-3px); }
        #enter-vr-btn:active { transform: scale(0.96); }
        #enter-vr-btn:disabled { background: #555; box-shadow: none; cursor: not-allowed; opacity: 0.6; }
        
        #vr-hints {
            position: fixed; bottom: 130px; left: 50%; transform: translateX(-50%);
            z-index: 15; pointer-events: none; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center;
        }
        .hint-badge {
            background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
            border-radius: 20px; padding: 8px 18px; color: #fff; font-size: 13px;
            letter-spacing: 1px; white-space: nowrap;
        }
        .hint-badge .key { font-weight: 700; color: #ffd700; }
        
        #status-msg {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
            z-index: 30; color: #fff; font-size: 18px; text-align: center;
            background: rgba(0,0,0,0.75); padding: 20px 30px;
            border-radius: 16px; display: none;
        }
        #status-msg.error { background: rgba(180,30,30,0.85); display: block; }
        
        #loading {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
            color: #fff; font-size: 20px; z-index: 100;
            display: flex; flex-direction: column; align-items: center; gap: 12px;
        }
        #loading-spinner {
            width: 48px; height: 48px; border: 4px solid rgba(255,255,255,0.2);
            border-top-color: #fff; border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>

        function shootBullet(controller) {
            //
            // 【参数4】muzzleLocal —— 子弹出口位置 (相对于右手柄的局部坐标, 单位: 米)
            //   格式: new THREE.Vector3(X, Y, Z)
            //   X (左右): 正值=右侧, 负值=左侧  —— 当前: 0
            //   Y (上下): 正值=上方, 负值=下方  —— 当前: 0
            //   Z (前后): 正值=身后方, 负值=身前方 —— 当前: -0.2 (枪口前方0.2米处)
            //
            //   ⚠️ 重要: 这个值应该和枪模型的枪口位置对齐！
            //   如果子弹从枪中间射出 → 调 Z 让出口更靠前 (如 -0.3, -0.4)
            //   如果子弹从枪后面射出 → 调 Z 让出口更靠后 (如 -0.1, 0)
            //   如果子弹偏上/偏下 → 调 Y
            //   如果子弹偏左/偏右 → 调 X
            //
            const muzzleLocal = new THREE.Vector3(0, 0, -0.6);
            //
            // 下面几行是把局部坐标转换成世界坐标, 一般不用改
            const origin = muzzleLocal.clone().applyMatrix4(controller.matrixWorld);
            const quat = controller.getWorldQuaternion(new THREE.Quaternion());
            const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(quat);
            
            const bulletGeom = new THREE.SphereGeometry(0.03, 8, 8);
            const bulletMat = new THREE.MeshStandardMaterial({ 
                color: 0xffaa00, 
                emissive: 0xff4400,
                emissiveIntensity: 0.8
            });
            const bullet = new THREE.Mesh(bulletGeom, bulletMat);
            bullet.position.copy(origin);
            bullet.userData = { 
                vel: dir.clone().normalize().multiplyScalar(BULLET_SPEED), 
                life: BULLET_LIFE 
            };
            bullet.castShadow = true;
            bulletGroup.add(bullet);
            bullets.push(bullet);
        }

        function updateBullets(dt) {
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.position.x += b.userData.vel.x * dt;
                b.position.y += b.userData.vel.y * dt;
                b.position.z += b.userData.vel.z * dt;
                b.userData.life -= dt;
                
                // 超出范围或生命结束则移除
                if (b.userData.life <= 0 || b.position.y < 0 || b.position.y > 50) {
                    b.geometry.dispose();
                    b.material.dispose();
                    bulletGroup.remove(b);
                    bullets.splice(i, 1);
                }
            }
        }

        function createCartoonCloudTexture(size = 512, cloudCount = 25) {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, size, size);

            function drawCloud(cx, cy, baseR) {
                const parts = [
                    [0, 0, baseR],
                    [-baseR * 0.7, -baseR * 0.3, baseR * 0.8],
                    [baseR * 0.7, -baseR * 0.3, baseR * 0.9],
                    [-baseR * 0.4, -baseR * 0.7, baseR * 0.7],
                    [baseR * 0.4, -baseR * 0.7, baseR * 0.75],
                    [0, -baseR * 0.9, baseR * 0.7],
                ];
                ctx.fillStyle = '#000000';
                parts.forEach(([dx, dy, r]) => {
                    ctx.beginPath();
                    ctx.arc(cx + dx, cy + dy, r + 2, 0, Math.PI * 2);
                    ctx.fill();
                });
                ctx.fillStyle = '#ffffff';
                parts.forEach(([dx, dy, r]) => {
                    ctx.beginPath();
                    ctx.arc(cx + dx, cy + dy, r, 0, Math.PI * 2);
                    ctx.fill();
                });
            }

            const margin = size * 0.1;
            for (let i = 0; i < cloudCount; i++) {
                const cx = margin + Math.random() * (size - margin * 2);
                const cy = margin + Math.random() * (size - margin * 2);
                const r = size * 0.04 + Math.random() * size * 0.06;
                drawCloud(cx, cy, r);
            }
            return new THREE.CanvasTexture(canvas);
        }

        function createCloudLayer(y, repeatCount, speed) {
            const texture = createCartoonCloudTexture();
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(repeatCount, repeatCount);

            const geometry = new THREE.CircleGeometry(80, 64);
            const material = new THREE.MeshBasicMaterial({
                map: texture,
                transparent: true,
                depthWrite: false,
                side: THREE.DoubleSide,
            });

            const mesh = new THREE.Mesh(geometry, material);
            mesh.rotation.x = -Math.PI / 2;
            mesh.position.y = y;
            mesh.userData = { speed, texture };
            return mesh;
        }

        const cloudLayer1 = createCloudLayer(0, 25, 0.02);

        function drawDebugPanel(info) {

        function roundRect(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        }

        // -------------------- 输入处理 --------------------
        let rightTrigger = false;
        let lastShootTime = 0;

        function updateInputs() {
            const session = renderer.xr.getSession();
            if (!session) return;
            rightInput.stickX = 0; rightInput.stickY = 0;
            leftInput.stickX = 0; leftInput.stickY = 0;
            rightTrigger = false;
            
            if (!session.inputSources) return;
            for (const source of session.inputSources) {
                if (!source.gamepad) continue;
                const gp = source.gamepad;
                const hand = source.handedness;
                let sx = 0, sy = 0;
                if (gp.axes.length >= 4) { sx = gp.axes[2]; sy = gp.axes[3]; }
                else if (gp.axes.length >= 2) { sx = gp.axes[0]; sy = gp.axes[1]; }
                
                const trigger = gp.buttons[0]?.value > 0.5;
                
                if (hand === 'right') {
                    rightInput.stickX = sx; rightInput.stickY = sy;
                    rightTrigger = trigger;
                } else if (hand === 'left') {
                    leftInput.stickX = sx; leftInput.stickY = sy;
                }
            }
        }

        function handleShooting() {
            if (!rightController || !rightTrigger) return;
            const now = performance.now();
            if (now - lastShootTime > SHOOT_COOLDOWN) {
                shootBullet(rightController);
                lastShootTime = now;
            }
        }

        function handleMovement(dt) {
            let sx = rightInput.stickX, sy = rightInput.stickY;
            if (Math.abs(sx) < DEADZONE && Math.abs(sy) < DEADZONE) {
                sx = leftInput.stickX; sy = leftInput.stickY;
            }
            if (Math.abs(sx) < DEADZONE && Math.abs(sy) < DEADZONE) {
                // 摇杆回中，云海滚动逐渐减速
                cloudScroll.x *= 0.92;
                cloudScroll.y *= 0.92;
                return;
            }

            const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            forward.y = 0; forward.normalize();
            const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
            right.y = 0; right.normalize();

            // 摇杆控制云海滚动方向和速度（摇杆前推 = 云向身后流 = 向前飞的错觉）
            const intensity = Math.max(Math.abs(sx), Math.abs(sy));
            const scrollSpeed = 2.0 * intensity;
            cloudScroll.x = (forward.x * sy + right.x * sx) * scrollSpeed;
            cloudScroll.y = (forward.z * sy + right.z * sx) * scrollSpeed;

            // 玩家只在极小的范围内轻微晃动，模拟热气球颠簸感
            const swaySpeed = 0.5;
            dolly.position.x += (Math.random() - 0.5) * swaySpeed * dt * intensity;
            dolly.position.z += (Math.random() - 0.5) * swaySpeed * dt * intensity;
            dolly.position.x = Math.min(0.3, Math.max(-0.3, dolly.position.x));
            dolly.position.z = Math.min(0.3, Math.max(-0.3, dolly.position.z));
        }

        function handleExit() {
            const session = renderer.xr.getSession();
            if (!session) return;
            if (!session.inputSources) return;
            for (const src of session.inputSources) {
                if (!src.gamepad) continue;
                if (src.handedness === 'right') {
                    const btnA = src.gamepad.buttons[4]?.pressed;
                    const btnB = src.gamepad.buttons[5]?.pressed;
                    if (btnA || btnB) { session.end(); break; }
                }
            }
        }

        // -------------------- 动画循环 --------------------
        const clock = new THREE.Clock();
        const tempPos = new THREE.Vector3();

        function updateCloudLayers(dt) {
            camera.getWorldPosition(tempPos);
            cloudLayers.forEach((layer, idx) => {
                // 云海平滑跟随相机，但允许有轻微的滞后感
                layer.position.x += (tempPos.x - layer.position.x) * 0.05;
                layer.position.z += (tempPos.z - layer.position.z) * 0.05;

                const tex = layer.userData.texture;
                // 摇杆控制纹理滚动：不同层速度不同形成视差
                const parallax = idx === 0 ? 1.0 : 0.6;
                tex.offset.x += cloudScroll.x * dt * parallax;
                tex.offset.y += cloudScroll.y * dt * parallax;
            });
        }

        function animate() {
            const dt = Math.min(clock.getDelta(), 0.1);

            if (renderer.xr.isPresenting) {
                updateInputs();
                handleMovement(dt);
                handleShooting();
                updateBullets(dt);
                updateLasers();
                handleExit();
                updateDebugPanel();
                updateCloudLayers(dt);
                vrEntryEl.style.display = 'none';
                vrHintsEl.style.display = 'none';
            } else {
                updateCloudLayers(dt);
                vrEntryEl.style.display = 'block';
                vrHintsEl.style.display = 'flex';
            }

            renderer.render(scene, camera);
        }
        renderer.setAnimationLoop(animate);

        // -------------------- 初始化 --------------------
        async function initScene() {
            setupController(0);
            setupController(1);

            enterVRBtn.onclick = async () => {
                enterVRBtn.disabled = true;
                enterVRBtn.textContent = '⏳ 启动中...';
                try {
                    if (!navigator.xr) {
                        throw new Error('浏览器不支持 WebXR');
                    }
                    
                    let session;
                    try {
                        if (navigator.xr.isSessionSupported) {
                            const supported = await navigator.xr.isSessionSupported('immersive-vr');
                            if (!supported) throw new Error('设备不支持VR');
                        }
                        session = await navigator.xr.requestSession('immersive-vr', {
                            requiredFeatures: ['local-floor']
                        });
                    } catch (e) {
                        console.log('使用 PICO 兼容模式:', e.message);
                        session = await navigator.xr.requestSession('immersive-vr');
                    }
                    
                    renderer.xr.setSession(session);
                    enterVRBtn.disabled = false;
                    enterVRBtn.textContent = '🎈 进入VR场景';
                } catch (err) {
                    statusMsgEl.innerHTML = '❌ ' + err.message;
                    statusMsgEl.classList.add('error');
                    enterVRBtn.disabled = false;
                    enterVRBtn.textContent = '🎈 进入VR场景';
                }
            };

            renderer.xr.addEventListener('sessionend', () => {
                enterVRBtn.disabled = false;
                vrEntryEl.style.display = 'block';
                vrHintsEl.style.display = 'flex';
                statusMsgEl.style.display = 'none';
            });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            // 页面卸载时清理资源
            window.addEventListener('beforeunload', () => {
                renderer.dispose();
                scene.traverse(obj => {
                    if (obj.geometry) obj.geometry.dispose();
                    if (obj.material) {
                        if (Array.isArray(obj.material)) {
                            obj.material.forEach(m => m.dispose());
                        } else {
                            obj.material.dispose();
                        }
                    }
                });
                cloudLayers.forEach(layer => {
                    if (layer.userData.texture) layer.userData.texture.dispose();
                    if (layer.material) layer.material.dispose();
                    if (layer.geometry) layer.geometry.dispose();
                });
                dracoLoader.dispose();
            });
        }

        initScene();
    </script>
