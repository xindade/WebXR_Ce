<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>VR 热气球托盘场景 - Ak48压缩版</title>
    <style>
        :root { --bg: #1a1a2e; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg); overflow: hidden;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            height: 100vh; width: 100vw;
            user-select: none; -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        canvas { display: block; }
        
        #vr-entry { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 20; }
        #enter-vr-btn {
            display: block; padding: 16px 44px; font-size: 20px; font-weight: 700;
            letter-spacing: 2px; color: #fff;
            background: linear-gradient(135deg, #e94560, #c23152);
            border: none; border-radius: 50px; cursor: pointer;
            transition: all 0.3s ease; box-shadow: 0 8px 30px rgba(233,69,96,0.5);
            text-transform: uppercase; outline: none;
        }
        #enter-vr-btn:hover { background: linear-gradient(135deg, #ff5a7a, #e94560); transform: translateY(-3px); }
        #enter-vr-btn:active { transform: scale(0.96); }
        #enter-vr-btn:disabled { background: #555; box-shadow: none; cursor: not-allowed; opacity: 0.6; }
        
        #vr-hints {
            position: fixed; bottom: 130px; left: 50%; transform: translateX(-50%);
            z-index: 15; pointer-events: none; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center;
        }
        .hint-badge {
            background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
            border-radius: 20px; padding: 8px 18px; color: #fff; font-size: 13px;
            letter-spacing: 1px; white-space: nowrap;
        }
        .hint-badge .key { font-weight: 700; color: #ffd700; }
        
        #status-msg {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
            z-index: 30; color: #fff; font-size: 18px; text-align: center;
            background: rgba(0,0,0,0.75); padding: 20px 30px;
            border-radius: 16px; display: none;
        }
        #status-msg.error { background: rgba(180,30,30,0.85); display: block; }
        
        #loading {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
            color: #fff; font-size: 20px; z-index: 100;
            display: flex; flex-direction: column; align-items: center; gap: 12px;
        }
        #loading-spinner {
            width: 48px; height: 48px; border: 4px solid rgba(255,255,255,0.2);
            border-top-color: #fff; border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loading">
        <div id="loading-spinner"></div>
        <div>加载中...</div>
    </div>
    <div id="vr-entry"><button id="enter-vr-btn">🎈 进入VR场景</button></div>
    <div id="vr-hints">
        <span class="hint-badge">🔫 <span class="key">扳机</span> 射击</span>
        <span class="hint-badge">🕹️ <span class="key">摇杆</span> 移动</span>
        <span class="hint-badge">🅰️ <span class="key">A键</span> 退出</span>
    </div>
    <div id="status-msg"></div>

    <!-- 本地文件，HTTP 服务器即可，PICO 浏览器无需访问任何外部网络 -->
    <script type="importmap">
        {
            "imports": {
                "three": "./three.module.js",
                "three/addons/": "./jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

        // DOM 元素
        const enterVRBtn = document.getElementById('enter-vr-btn');
        const statusMsgEl = document.getElementById('status-msg');
        const vrHintsEl = document.getElementById('vr-hints');
        const vrEntryEl = document.getElementById('vr-entry');
        const loadingEl = document.getElementById('loading');

        // -------------------- 加载状态管理 --------------------
        const loadingResources = { texture: false, model: false };
        let loadingHidden = false;

        function checkAllLoaded(msg) {
            if (loadingHidden) return;
            if (msg) {
                loadingEl.innerHTML = '<div style="color:#ffaa00;">' + msg + '</div>';
                setTimeout(() => { loadingEl.style.display = 'none'; loadingHidden = true; }, 1500);
                return;
            }
            if (loadingResources.texture && loadingResources.model) {
                loadingHidden = true;
                loadingEl.style.display = 'none';
            }
        }

        function onResourceError(msg) {
            loadingEl.innerHTML = '<div style="color:#ffaa00;">' + msg + '</div>';
            setTimeout(() => { loadingEl.style.display = 'none'; loadingHidden = true; }, 2000);
        }

        // 最长等待 15 秒后强制关闭
        setTimeout(() => {
            if (!loadingHidden) onResourceError('⚠️ 加载超时，检查 HTTP 服务器是否运行中...');
        }, 15000);

        // 摇杆和输入状态
        const rightInput = { stickX: 0, stickY: 0 };
        const leftInput = { stickX: 0, stickY: 0 };

        const MOVE_SPEED = 3.5;
        const DEADZONE = 0.2;
        const SHOOT_COOLDOWN = 150; // 射击冷却时间(ms)

        // Three.js 核心
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.xr.enabled = true;
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 30, 100);

        const camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.1, 200);
        camera.position.set(0, 1.6, 0);
        const dolly = new THREE.Group();
        dolly.add(camera);
        scene.add(dolly);

        // 光照
        scene.add(new THREE.AmbientLight(0xffeedd, 1.2));
        const sunLight = new THREE.DirectionalLight(0xffffff, 2.5);
        sunLight.position.set(20, 40, 10);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 100;
        sunLight.shadow.camera.left = -30;
        sunLight.shadow.camera.right = 30;
        sunLight.shadow.camera.top = 30;
        sunLight.shadow.camera.bottom = -30;
        scene.add(sunLight);
        scene.add(new THREE.HemisphereLight(0x87CEEB, 0x90EE90, 0.8));

        // -------------------- 子弹系统 --------------------
        const bullets = [];
        const bulletGroup = new THREE.Group();
        scene.add(bulletGroup);
        const BULLET_SPEED = 15;
        const BULLET_LIFE = 3;

        function shootBullet(controller) {
            const muzzleLocal = new THREE.Vector3(0, 0, -0.2);
            const origin = muzzleLocal.clone().applyMatrix4(controller.matrixWorld);
            const quat = controller.getWorldQuaternion(new THREE.Quaternion());
            const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(quat);
            
            const bulletGeom = new THREE.SphereGeometry(0.03, 8, 8);
            const bulletMat = new THREE.MeshStandardMaterial({ 
                color: 0xffaa00, 
                emissive: 0xff4400,
                emissiveIntensity: 0.8
            });
            const bullet = new THREE.Mesh(bulletGeom, bulletMat);
            bullet.position.copy(origin);
            bullet.userData = { 
                vel: dir.clone().normalize().multiplyScalar(BULLET_SPEED), 
                life: BULLET_LIFE 
            };
            bullet.castShadow = true;
            bulletGroup.add(bullet);
            bullets.push(bullet);
        }

        function updateBullets(dt) {
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.position.x += b.userData.vel.x * dt;
                b.position.y += b.userData.vel.y * dt;
                b.position.z += b.userData.vel.z * dt;
                b.userData.life -= dt;
                
                // 超出范围或生命结束则移除
                if (b.userData.life <= 0 || b.position.y < 0 || b.position.y > 50) {
                    b.geometry.dispose();
                    b.material.dispose();
                    bulletGroup.remove(b);
                    bullets.splice(i, 1);
                }
            }
        }

        // -------------------- 卡通热气球托盘地面 --------------------
        const textureLoader = new THREE.TextureLoader();
        let groundMat = null;

        textureLoader.load(
            encodeURI('image/卡通热气球托盘生成 (3).png'),
            (texture) => {
                texture.colorSpace = THREE.SRGBColorSpace;
                texture.wrapS = THREE.RepeatWrapping;
                texture.wrapT = THREE.RepeatWrapping;
                
                groundMat = new THREE.MeshStandardMaterial({
                    map: texture,
                    roughness: 0.8,
                    metalness: 0.1,
                    side: THREE.DoubleSide
                });
                
                // 更新地面材质
                if (ground) ground.material = groundMat;

                loadingResources.texture = true;
                checkAllLoaded();
                console.log('地面纹理加载成功');
            },
            undefined,
            (error) => {
                console.error('地面纹理加载失败:', error);
                // 使用纯色备用材质
                groundMat = new THREE.MeshStandardMaterial({
                    color: 0x8B4513,
                    roughness: 0.9,
                    metalness: 0.0
                });
                if (ground) ground.material = groundMat;
                loadingResources.texture = true;
                onResourceError('⚠️ 地面纹理加载失败，已使用备用材质');
            }
        );

        const groundGeometry = new THREE.PlaneGeometry(20, 20);
        // 先使用临时材质，等纹理加载完成后更新
        const tempMat = new THREE.MeshStandardMaterial({
            color: 0x8B4513,
            roughness: 0.9,
            metalness: 0.0
        });
        const ground = new THREE.Mesh(groundGeometry, tempMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = 0;
        ground.receiveShadow = true;
        scene.add(ground);

        // 添加云朵装饰
        function createCloud(x, y, z, scale = 1) {
            const cloudGroup = new THREE.Group();
            const cloudMat = new THREE.MeshStandardMaterial({ 
                color: 0xffffff, 
                roughness: 1,
                metalness: 0
            });
            
            const spheres = [
                { pos: [0, 0, 0], r: 0.8 },
                { pos: [0.6, 0.2, 0], r: 0.6 },
                { pos: [-0.6, 0.1, 0], r: 0.55 },
                { pos: [0.3, 0.4, 0], r: 0.5 },
                { pos: [-0.3, 0.35, 0], r: 0.45 },
            ];
            
            spheres.forEach(s => {
                const sphere = new THREE.Mesh(
                    new THREE.SphereGeometry(s.r, 16, 12),
                    cloudMat
                );
                sphere.position.set(...s.pos);
                cloudGroup.add(sphere);
            });
            
            cloudGroup.position.set(x, y, z);
            cloudGroup.scale.setScalar(scale);
            return cloudGroup;
        }

        const clouds = [
            createCloud(-8, 5, -10, 1.5),
            createCloud(10, 6, -15, 2),
            createCloud(-5, 7, 8, 1.2),
            createCloud(15, 5, 5, 1.8),
        ];
        clouds.forEach(cloud => scene.add(cloud));

        // -------------------- 激光射线 --------------------
        function updateLasers() {
            [leftGrip, rightGrip].forEach(grip => {
                if (!grip) return;
                grip.traverse(child => {
                    if (child.userData && child.userData.laser) {
                        child.scale.set(1, 30, 1);
                        child.position.set(0, 0, -0.15);
                    }
                });
            });
        }

        // -------------------- 调试 UI 面板（右手腕 3D Canvas） --------------------
        let debugPanel = null;
        let debugCanvas = null;
        let debugCtx = null;
        let debugTexture = null;

        function createDebugPanel() {
            debugCanvas = document.createElement('canvas');
            debugCanvas.width = 512;
            debugCanvas.height = 256;
            debugCtx = debugCanvas.getContext('2d');

            debugTexture = new THREE.CanvasTexture(debugCanvas);

            const panelGeo = new THREE.PlaneGeometry(0.18, 0.09);
            const panelMat = new THREE.MeshBasicMaterial({
                map: debugTexture,
                transparent: true,
                depthTest: false,
                depthWrite: false,
                side: THREE.DoubleSide
            });
            debugPanel = new THREE.Mesh(panelGeo, panelMat);

            // 手腕背侧，稍微倾斜让玩家翻腕可见
            debugPanel.position.set(0, 0.06, 0.04);
            debugPanel.rotation.x = -Math.PI * 0.35;

            drawDebugPanel('初始化中...');
            return debugPanel;
        }

        function drawDebugPanel(info) {
            if (!debugCtx) return;
            const c = debugCtx;
            const w = debugCanvas.width;
            const h = debugCanvas.height;

            c.clearRect(0, 0, w, h);
            c.fillStyle = 'rgba(0,0,0,0.82)';
            roundRect(c, 0, 0, w, h, 24);
            c.fill();

            c.strokeStyle = '#00ffcc';
            c.lineWidth = 4;
            roundRect(c, 2, 2, w - 4, h - 4, 22);
            c.stroke();

            c.fillStyle = '#00ffcc';
            c.font = 'bold 28px monospace';
            c.fillText('🔧 DEBUG', 18, 42);

            c.fillStyle = '#ffffff';
            c.font = '22px monospace';
            const lines = info.split('\n');
            lines.forEach((line, i) => {
                c.fillText(line, 18, 80 + i * 30);
            });

            if (debugTexture) debugTexture.needsUpdate = true;
        }

        function roundRect(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        }

        function updateDebugPanel() {
            if (!rightGrip || !debugPanel) return;
            const wp = new THREE.Vector3();
            rightGrip.getWorldPosition(wp);
            const wr = new THREE.Euler();
            const wq = new THREE.Quaternion();
            rightGrip.getWorldQuaternion(wq);
            wr.setFromQuaternion(wq);

            const toDeg = r => (r * 180 / Math.PI).toFixed(1);
            const toM = v => v.toFixed(2);

            const modelStatus = ak48Model ? '模型:✅' : '模型:⏳';
            const attachStatus = ak48Attached ? '挂载:✅' : '挂载:❌';
            const info = [
                `Pos  X:${toM(wp.x)} Y:${toM(wp.y)} Z:${toM(wp.z)}`,
                `Rot  X:${toDeg(wr.x)}° Y:${toDeg(wr.y)}°`,
                `     Z:${toDeg(wr.z)}°`,
                `AK48  ${modelStatus} ${attachStatus}`
            ].join('\n');

            drawDebugPanel(info);
        }

        // -------------------- 手柄模型 --------------------
        const controllers = [];
        let leftController, rightController;
        let ak48Model = null;
        let ak48Attached = false;
        let rightGrip = null, leftGrip = null;

        // 加载 AK48 枪支模型（Draco 压缩版本）
        const dracoLoader = new DRACOLoader();
        dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
        dracoLoader.setDecoderConfig({ type: 'js' });  // 强制使用 JS 解码器

        const gltfLoader = new GLTFLoader();
        gltfLoader.setDRACOLoader(dracoLoader);
        gltfLoader.load(
            'Ak48.glb',
            (gltf) => {
                console.log('✅ Ak48.glb 加载成功');
                ak48Model = gltf.scene;
                ak48Model.scale.set(1, 1, 1);
                ak48Model.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });
                attachAK48();
                loadingResources.model = true;
                checkAllLoaded();
            },
            (progress) => {
                if (progress.total > 0) {
                    const pct = (progress.loaded / progress.total * 100).toFixed(1);
                    document.getElementById('loading').innerHTML = 
                        '<div id="loading-spinner"></div><div>加载模型: ' + pct + '%</div>';
                }
            },
            (error) => {
                console.error('❌ 模型加载失败:', error);
                loadingResources.model = true;
                onResourceError('⚠️ 模型加载失败');
            }
        );

        function createControllerModel(isRight) {
            const group = new THREE.Group();
            
            // 激光射线
            const laserGeo = new THREE.CylinderGeometry(0.003, 0.003, 1, 8);
            laserGeo.rotateX(Math.PI / 2);
            const laserMat = new THREE.MeshBasicMaterial({ 
                color: isRight ? 0xff3333 : 0x33aaff, 
                transparent: true, 
                opacity: 0.7 
            });
            const laser = new THREE.Mesh(laserGeo, laserMat);
            laser.position.set(0, 0, -0.1);
            group.add(laser);
            group.userData.laser = laser;
            
            return group;
        }

        function setupController(idx) {
            const controller = renderer.xr.getController(idx);
            const grip = renderer.xr.getControllerGrip(idx);
            const model = createControllerModel(idx === 1);
            grip.add(model);
            dolly.add(controller);
            dolly.add(grip);
            controllers.push(controller);
            
            if (idx === 1) {
                rightGrip = grip;
                attachAK48();
                // 调试面板挂到右手腕
                const panel = createDebugPanel();
                grip.add(panel);
            } else {
                leftGrip = grip;
            }
            
            if (idx === 0) leftController = controller;
            else rightController = controller;
        }

        // -------------------- 枪支缩放配置（修改这里调整大小） --------------------
        // 当前值 0.6 = 原始大小的 60%，可根据实际模型大小调整
        const AK48_SCALE = 0.6;  // ← 调整这个数字来改变枪的大小

        // 附加 AK48 到右手柄
        function attachAK48() {
            console.log('attachAK48 被调用', { 
                hasModel: !!ak48Model, 
                hasRightGrip: !!rightGrip, 
                alreadyAttached: ak48Attached 
            });
            
            if (!ak48Model) { console.log('AK48 模型尚未加载，跳过'); return; }
            if (!rightGrip) { console.log('右手柄尚未初始化，跳过'); return; }
            if (ak48Attached) { console.log('AK48 已附加，跳过'); return; }
            
            const gunInstance = ak48Model.clone();
            
            // 计算原始尺寸并应用缩放
            const box = new THREE.Box3().setFromObject(gunInstance);
            const size = new THREE.Vector3();
            box.getSize(size);
            console.log('AK48 原始尺寸:', size.x.toFixed(3), size.y.toFixed(3), size.z.toFixed(3));
            console.log('AK48 当前缩放值:', AK48_SCALE, '→ 缩放后长度约:', (Math.max(size.x, size.y, size.z) * AK48_SCALE).toFixed(3), '米');
            
            gunInstance.scale.set(AK48_SCALE, AK48_SCALE, AK48_SCALE);
            
            gunInstance.traverse((child) => {
                if (child.isMesh) child.castShadow = true;
            });
            
            // 枪管朝前，放置在手柄前方
            // Y旋转90度，Y位置减少0.1
            gunInstance.rotation.y = Math.PI / 2;
            gunInstance.position.set(0, -0.1, -0.12);
            
            rightGrip.add(gunInstance);
            ak48Attached = true;
            console.log('AK48 已成功附加到右手柄');
        }

        renderer.xr.addEventListener('sessionstart', () => {
            setTimeout(() => { attachAK48(); }, 100);
        });

        // -------------------- 输入处理 --------------------
        let rightTrigger = false;
        let lastShootTime = 0;

        function updateInputs() {
            const session = renderer.xr.getSession();
            if (!session) return;
            rightInput.stickX = 0; rightInput.stickY = 0;
            leftInput.stickX = 0; leftInput.stickY = 0;
            rightTrigger = false;
            
            if (!session.inputSources) return;
            for (const source of session.inputSources) {
                if (!source.gamepad) continue;
                const gp = source.gamepad;
                const hand = source.handedness;
                let sx = 0, sy = 0;
                if (gp.axes.length >= 4) { sx = gp.axes[2]; sy = gp.axes[3]; }
                else if (gp.axes.length >= 2) { sx = gp.axes[0]; sy = gp.axes[1]; }
                
                const trigger = gp.buttons[0]?.value > 0.5;
                
                if (hand === 'right') {
                    rightInput.stickX = sx; rightInput.stickY = sy;
                    rightTrigger = trigger;
                } else if (hand === 'left') {
                    leftInput.stickX = sx; leftInput.stickY = sy;
                }
            }
        }

        function handleShooting() {
            if (!rightController || !rightTrigger) return;
            const now = performance.now();
            if (now - lastShootTime > SHOOT_COOLDOWN) {
                shootBullet(rightController);
                lastShootTime = now;
            }
        }

        function handleMovement(dt) {
            let sx = rightInput.stickX, sy = rightInput.stickY;
            if (Math.abs(sx) < DEADZONE && Math.abs(sy) < DEADZONE) {
                sx = leftInput.stickX; sy = leftInput.stickY;
            }
            if (Math.abs(sx) < DEADZONE && Math.abs(sy) < DEADZONE) return;
            
            const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            forward.y = 0; forward.normalize();
            const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
            right.y = 0; right.normalize();
            
            const moveDir = new THREE.Vector3()
                .addScaledVector(forward, -sy)
                .addScaledVector(right, sx)
                .normalize();
            const speed = MOVE_SPEED * Math.max(Math.abs(sx), Math.abs(sy));
            dolly.position.addScaledVector(moveDir, speed * dt);
            
            dolly.position.x = Math.min(8, Math.max(-8, dolly.position.x));
            dolly.position.z = Math.min(8, Math.max(-8, dolly.position.z));
        }

        function handleExit() {
            const session = renderer.xr.getSession();
            if (!session) return;
            if (!session.inputSources) return;
            for (const src of session.inputSources) {
                if (!src.gamepad) continue;
                if (src.handedness === 'right') {
                    const btnA = src.gamepad.buttons[4]?.pressed;
                    const btnB = src.gamepad.buttons[5]?.pressed;
                    if (btnA || btnB) { session.end(); break; }
                }
            }
        }

        // -------------------- 动画循环 --------------------
        const clock = new THREE.Clock();
        function animate() {
            const dt = Math.min(clock.getDelta(), 0.1);
            
            if (renderer.xr.isPresenting) {
                updateInputs();
                handleMovement(dt);
                handleShooting();
                updateBullets(dt);
                updateLasers();
                handleExit();
                updateDebugPanel();
                vrEntryEl.style.display = 'none';
                vrHintsEl.style.display = 'none';
            } else {
                vrEntryEl.style.display = 'block';
                vrHintsEl.style.display = 'flex';
            }
            
            renderer.render(scene, camera);
        }
        renderer.setAnimationLoop(animate);

        // -------------------- 初始化 --------------------
        async function initScene() {
            setupController(0);
            setupController(1);

            enterVRBtn.onclick = async () => {
                enterVRBtn.disabled = true;
                enterVRBtn.textContent = '⏳ 启动中...';
                try {
                    if (!navigator.xr) {
                        throw new Error('浏览器不支持 WebXR');
                    }
                    
                    let session;
                    try {
                        if (navigator.xr.isSessionSupported) {
                            const supported = await navigator.xr.isSessionSupported('immersive-vr');
                            if (!supported) throw new Error('设备不支持VR');
                        }
                        session = await navigator.xr.requestSession('immersive-vr', {
                            requiredFeatures: ['local-floor']
                        });
                    } catch (e) {
                        console.log('使用 PICO 兼容模式:', e.message);
                        session = await navigator.xr.requestSession('immersive-vr');
                    }
                    
                    renderer.xr.setSession(session);
                    enterVRBtn.disabled = false;
                    enterVRBtn.textContent = '🎈 进入VR场景';
                } catch (err) {
                    statusMsgEl.innerHTML = '❌ ' + err.message;
                    statusMsgEl.classList.add('error');
                    enterVRBtn.disabled = false;
                    enterVRBtn.textContent = '🎈 进入VR场景';
                }
            };

            renderer.xr.addEventListener('sessionend', () => {
                enterVRBtn.disabled = false;
                vrEntryEl.style.display = 'block';
                vrHintsEl.style.display = 'flex';
                statusMsgEl.style.display = 'none';
            });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            // 页面卸载时清理资源
            window.addEventListener('beforeunload', () => {
                renderer.dispose();
                scene.traverse(obj => {
                    if (obj.geometry) obj.geometry.dispose();
                    if (obj.material) {
                        if (Array.isArray(obj.material)) {
                            obj.material.forEach(m => m.dispose());
                        } else {
                            obj.material.dispose();
                        }
                    }
                });
                if (groundMat && groundMat.map) groundMat.map.dispose();
                dracoLoader.dispose();
            });
        }

        initScene();
    </script>
</body>
</html>
