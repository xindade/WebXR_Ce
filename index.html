<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
    <title>VR 热气球托盘场景 - 模块化版</title>
    <style>
        :root { --bg: #1a1a2e; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg); overflow: hidden;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            height: 100vh; width: 100vw;
            user-select: none; -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        canvas { display: block; }

        #vr-entry { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 20; display: flex; gap: 28px; align-items: flex-end; }
        #btn-container { display: flex; flex-direction: column; gap: 12px; align-items: center; }
        #level-container { display: flex; flex-direction: column; gap: 4px; align-items: center; }
        .vr-btn {
            display: block; padding: 16px 44px; font-size: 20px; font-weight: 700;
            letter-spacing: 2px; color: #fff;
            background: linear-gradient(135deg, #e94560, #c23152);
            border: none; border-radius: 50px; cursor: pointer;
            transition: all 0.3s ease; box-shadow: 0 8px 30px rgba(233,69,96,0.5);
            text-transform: uppercase; outline: none; min-width: 280px;
        }
        .vr-btn:hover { background: linear-gradient(135deg, #ff5a7a, #e94560); transform: translateY(-3px); }
        .vr-btn:active { transform: scale(0.96); }
        .vr-btn:disabled { background: #555; box-shadow: none; cursor: not-allowed; opacity: 0.6; }
        .vr-btn-alt {
            background: linear-gradient(135deg, #2196F3, #1976D2);
            box-shadow: 0 8px 30px rgba(33,150,243,0.5);
        }
        .vr-btn-alt:hover { background: linear-gradient(135deg, #42a5f5, #2196F3); }

        #vr-hints {
            position: fixed; bottom: 130px; left: 50%; transform: translateX(-50%);
            z-index: 15; pointer-events: none; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center;
        }
        .hint-badge {
            background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
            border-radius: 20px; padding: 8px 18px; color: #fff; font-size: 13px;
            letter-spacing: 1px; white-space: nowrap;
        }
        .hint-badge .key { font-weight: 700; color: #ffd700; }

        #status-msg {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
            z-index: 30; color: #fff; font-size: 18px; text-align: center;
            background: rgba(0,0,0,0.75); padding: 20px 30px;
            border-radius: 16px; display: none;
        }
        #status-msg.error { background: rgba(180,30,30,0.85); display: block; }

        #loading {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
            color: #fff; font-size: 20px; z-index: 100;
            display: flex; flex-direction: column; align-items: center; gap: 12px;
        }
        #loading-spinner {
            width: 48px; height: 48px; border: 4px solid rgba(255,255,255,0.2);
            border-top-color: #fff; border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        #time-switch {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            z-index: 25; display: flex; gap: 10px;
        }
        .time-btn {
            padding: 10px 24px; font-size: 15px; font-weight: 700;
            letter-spacing: 1px; color: #fff; border: 2px solid rgba(255,255,255,0.3);
            border-radius: 30px; cursor: pointer; outline: none;
            background: rgba(0,0,0,0.4); backdrop-filter: blur(8px);
            transition: all 0.3s ease;
        }
        .time-btn:hover { background: rgba(255,255,255,0.2); border-color: #fff; }
        .time-btn.active { background: rgba(255,255,255,0.3); border-color: #ffd700; box-shadow: 0 0 16px rgba(255,215,0,0.5); }
        .time-btn:nth-child(1) { border-left: 3px solid #ffaa00; }
        .time-btn:nth-child(2) { border-left: 3px solid #4da6ff; }
        .time-btn:nth-child(3) { border-left: 3px solid #8899ff; }

        #sky-hint {
            position: fixed; top: 80px; left: 50%; transform: translateX(-50%);
            z-index: 24; pointer-events: none;
            color: rgba(255,255,255,0.6); font-size: 12px; letter-spacing: 1px;
        }

        /* ===== 日志面板 ===== */
        #log-panel {
            position: fixed; left: 0; top: 0; width: 42vw; height: 100vh;
            z-index: 50; pointer-events: none;
            background: rgba(0,0,0,0.88);
            color: #00ff88; font: 11px/1.4 'Consolas', 'Courier New', monospace;
            padding: 10px 12px; overflow-y: auto;
            border-right: 1px solid rgba(0,255,136,0.15);
            white-space: pre-wrap; word-break: break-all;
        }
        #log-panel::-webkit-scrollbar { width: 4px; }
        #log-panel::-webkit-scrollbar-thumb { background: #00ff88; border-radius: 2px; }
        .log-e { color: #ff4444; }
        .log-w { color: #ffaa00; }
        .log-s { color: #00ff88; }
        .log-i { color: #88ccff; }
        .log-time { color: #666; }
    </style>
</head>
<body>
    <!-- JS 执行状态指示器（最优先显示） -->
    <div id="js-status" style="position:fixed;top:4px;right:4px;z-index:9999;background:#000;color:#ff0;font:14px monospace;padding:4px 10px;border-radius:4px;">⏳ JS...</div>

    <div id="loading">
        <div id="loading-spinner"></div>
        <div>加载中...</div>
    </div>
    <div id="vr-entry">
        <div id="btn-container">
            <button id="enter-vr-btn" class="vr-btn">🎈 正常开始游戏</button>
            <button id="enter-vr-left-hand" class="vr-btn vr-btn-alt">🔫 左手持枪模式</button>
        </div>
        <div id="level-container">
            <div style="color:#fff;font-size:13px;letter-spacing:1px;margin-bottom:8px;text-align:center;opacity:0.7;">选择关卡</div>
            <button class="vr-btn level-btn" data-level="1" style="min-width:160px;padding:12px 24px;font-size:16px;">📌 关卡 1</button>
            <button class="vr-btn level-btn" data-level="2" style="min-width:160px;padding:12px 24px;font-size:16px;margin-top:8px;">📌 关卡 2</button>
            <button class="vr-btn level-btn" data-level="3" style="min-width:160px;padding:12px 24px;font-size:16px;margin-top:8px;">📌 关卡 3</button>
        </div>
    </div>
    <div id="vr-hints" style="display:none"></div>
    <div id="status-msg"></div>
    <div id="time-switch">
        <button id="btn-dusk" class="time-btn">🌅 黄昏</button>
        <button id="btn-day" class="time-btn active">☀️ 白天</button>
        <button id="btn-night" class="time-btn">🌙 夜晚</button>
    </div>
    <div id="sky-hint">VR中按左手 X/Y 键切换天空 · 30秒渐变过渡</div>
    <div id="log-panel">⏳ 等待日志...
如果长时间停留在此，说明 JS 未执行或 logger.js 加载失败。
右上角应有一个 JS 状态指示器。

    <!-- ===== 独立日志脚本（在 ES Module 之前加载） ===== -->
    <script src="js/logger.js"></script>

    <script type="module">
        import * as THREE from './three.module.js';
        import { renderer, scene, camera, choiceCardGroup, setShadow, updateSkyTransition, applySkyTarget, STATE } from './js/core.js';
        import { GameAPI as game } from './js/game.js';
        import { VrAPI as vr } from './js/vr.js';
        import { LaserAPI as laser } from './js/laser-level.js';

        // 将音频/VR模块注入游戏模块（避免循环依赖）
        game.setAudio(vr);
        game.setVR(vr);

        window.__log('index.html 模块导入完成 / GameAPI+VrAPI 就绪', 's');

        const enterVRBtn = document.getElementById('enter-vr-btn');
        const enterVRLeftHandBtn = document.getElementById('enter-vr-left-hand');
        const statusMsgEl = document.getElementById('status-msg');
        const vrHintsEl = document.getElementById('vr-hints');
        const vrEntryEl = document.getElementById('vr-entry');
        const logPanel = document.getElementById('log-panel');

        document.body.appendChild(renderer.domElement);

        // 时间切换按钮
        const timeBtns = {
            day: document.getElementById('btn-day'),
            dusk: document.getElementById('btn-dusk'),
            night: document.getElementById('btn-night')
        };
        function setActiveTimeBtn(name) {
            Object.keys(timeBtns).forEach(k => timeBtns[k].classList.remove('active'));
            if (timeBtns[name]) timeBtns[name].classList.add('active');
        }
        timeBtns.day.addEventListener('click', () => { applySkyTarget('day'); setActiveTimeBtn('day'); });
        timeBtns.dusk.addEventListener('click', () => { applySkyTarget('dusk'); setActiveTimeBtn('dusk'); });
        timeBtns.night.addEventListener('click', () => { applySkyTarget('night'); setActiveTimeBtn('night'); });

        // VR 会话
        async function enterVR(isLeftHandMode = false) {
            if (enterVRBtn.disabled) return;
            enterVRBtn.disabled = true;
            enterVRLeftHandBtn.disabled = true;
            enterVRBtn.textContent = '⏳ 启动中...';
            enterVRLeftHandBtn.textContent = '⏳ 启动中...';
            try {
                if (!navigator.xr) throw new Error('浏览器不支持 WebXR');
                let session;
                try {
                    if (navigator.xr.isSessionSupported) {
                        const supported = await navigator.xr.isSessionSupported('immersive-vr');
                        if (!supported) throw new Error('设备不支持VR');
                    }
                    session = await navigator.xr.requestSession('immersive-vr', { requiredFeatures: ['local-floor'] });
                } catch (e) {
                    console.log('使用 PICO 兼容模式:', e.message);
                    session = await navigator.xr.requestSession('immersive-vr');
                }
                STATE.leftHandGunEnabled = isLeftHandMode;
                window.__log('左手持枪模式: ' + (isLeftHandMode ? '启用' : '未启用'), 'i');
                renderer.xr.enabled = true;
                renderer.xr.setSession(session);
                window.__log('WebXR 会话已启动', 's');
                enterVRBtn.disabled = false;
                enterVRLeftHandBtn.disabled = false;
                enterVRBtn.textContent = '🎈 正常开始游戏';
                enterVRLeftHandBtn.textContent = '🔫 左手持枪模式';
            } catch (err) {
                window.__log('VR 会话请求失败: ' + err.message, 'e');
                statusMsgEl.innerHTML = '❌ ' + err.message;
                statusMsgEl.classList.add('error');
                enterVRBtn.disabled = false;
                enterVRLeftHandBtn.disabled = false;
                enterVRBtn.textContent = '🎈 正常开始游戏';
                enterVRLeftHandBtn.textContent = '🔫 左手持枪模式';
            }
        }

        enterVRBtn.onclick = () => enterVR(false);
        enterVRLeftHandBtn.onclick = () => enterVR(true);

        // 关卡选择按钮
        let selectedLevel = 0;
        document.querySelectorAll('.level-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                selectedLevel = parseInt(btn.dataset.level);
                STATE.playerStats.gold = 1000;
                STATE.playerStats.atk = 100;
                window.__log('已选关卡 ' + selectedLevel + '（gold:1000 atk:100）', 's');
                // 高亮当前选中的关卡按钮
                document.querySelectorAll('.level-btn').forEach(b => b.style.boxShadow = 'none');
                btn.style.boxShadow = '0 0 16px rgba(255,215,0,0.7)';
            });
        });

        // 动画循环
        const clock = new THREE.Clock();
        function animate() {
            const dt = Math.min(clock.getDelta(), 0.1);
            // 帧计数器 + 心跳日志（每 60 帧 ~1秒一次）
            if (!animate._frameCount) animate._frameCount = 0;
            animate._frameCount++;
            if (animate._frameCount % 60 === 1) {
                const xrState = renderer.xr.isPresenting ? 'VR中' : '非VR';
                window.__log('❤️ 帧#' + animate._frameCount + ' / XR:' + xrState + ' / dt:' + dt.toFixed(4) + ' / grip L:' + STATE.leftBtnState.grip + ' R:' + STATE.rightBtnState.grip, 'i');
            }
            try {
                updateSkyTransition(dt);
                game.updateCooldowns(dt);
                // 检测模式切换（在 updateCooldowns 设置 gameMode 之后）
                if (STATE.gameMode === 'laser' && !laser._initialized) {
                    laser._initialized = true;
                    laser.startLaserLevel();
                }

                if (renderer.xr.isPresenting) {
                    if (STATE.gameMode === 'laser') {
                        // 激光关卡模式
                        if (!STATE.gameOverState) {
                            vr.updateInputs();
                            vr.handleMovement(dt);
                            laser.updateLaserLevel(dt);
                            vr.handleExit();
                        }
                    } else if (!STATE.gameOverState) {
                        // 射击关卡模式
                        vr.updateInputs();
                        vr.handleMovement(dt);
                        vr.handleShooting();
                        game.updateBullets(dt);
                        game.updateBalloons(dt);
                        game.updateWaveSpawning(dt);
                        game.checkBulletBalloonCollisions();
                        game.checkLeftHandChoiceCardCollision();
                        game.updateChoiceCards(dt);
                        game.updateBuddhaPalm(dt);
                        vr.handleExit();
                        game.checkVRSkySwitch();
                    }
                    vr.updateGunRecoil();
                    game.updateTransitionClouds(dt);
                    game.updateDebris(dt);
                    game.updateParticles(dt);
                    if (!animate._frameCount) animate._frameCount = 0;
                    animate._frameCount++;
                    if (animate._frameCount % 5 === 0) {
                        vr.updateDebugPanel();
                        vr.updateLeftDebugPanel();
                    }
                    vrEntryEl.style.display = 'none';
                    vrHintsEl.style.display = 'none';
                } else {
                    vrEntryEl.style.display = 'block';
                    vrHintsEl.style.display = 'flex';
                }
            } catch (e) {
                console.error('Animate error:', e);
                window.__log('Animate 错误: ' + e.message, 'e');
                statusMsgEl.innerHTML = '❌ ' + e.message;
                statusMsgEl.classList.add('error');
                statusMsgEl.style.display = 'block';
            }
            try {
                renderer.render(scene, camera);
            } catch (e) {
                window.__log('Render 调用失败: ' + e.message, 'e');
                console.error('Render error:', e);
            }
        }
        renderer.setAnimationLoop(animate);

        // 初始化
        function initScene() {
            try {
                vr.setupController(0);
                vr.setupController(1);
                game.initTransitionClouds();
                window.__log('☁️ 转场云朵初始化', 's');
            } catch (e) {
                console.error('Init error:', e);
                statusMsgEl.innerHTML = '❌ 初始化错误: ' + e.message;
                statusMsgEl.classList.add('error');
            }
        }

        renderer.xr.addEventListener('sessionstart', () => {
            window.__log('sessionstart 事件触发', 's');
            setShadow(false);
            setTimeout(() => vr.attachAK48(), 100);
            if (STATE.leftHandGunEnabled) {
                setTimeout(() => vr.attachAK48ToLeft(), 100);
            }
            setTimeout(() => {
                if (!STATE.gameStarted) {
                    STATE.gameStarted = true;
                    STATE.gameOverState = false;
                    STATE.shipHp = 100;
                    STATE.shipHitFlash = 0;
                    // 应用关卡选择
                    if (selectedLevel > 0) {
                        STATE.playerStats.gold = 1000;
                        STATE.playerStats.atk = 100;
                        if (selectedLevel === 3) {
                            // 第三关：直接进入激光关卡
                            STATE.gameMode = 'laser';
                            window.__log('🎆 第三关：激光关卡启动', 's');
                        } else {
                            STATE.waveNumber = selectedLevel - 1;
                            window.__log('关卡' + selectedLevel + ' 生效: gold=' + STATE.playerStats.gold + ' atk=' + STATE.playerStats.atk + ' wave=' + STATE.waveNumber, 's');
                        }
                    }
                    if (STATE.gameMode === 'laser') {
                        laser.startLaserLevel();
                        laser._initialized = true;
                    } else {
                        game.spawnBalloons();
                        window.__log('游戏开始 / 气球生成', 's');
                    }
                }
            }, 500);
        });

        renderer.xr.addEventListener('sessionend', () => {
            window.__log('sessionend 事件触发', 'w');
            setShadow(true);
            enterVRBtn.disabled = false;
            enterVRLeftHandBtn.disabled = false;
            vrEntryEl.style.display = 'block';
            vrHintsEl.style.display = 'flex';
            statusMsgEl.style.display = 'none';
            STATE.gameStarted = false;
            STATE.waveNumber = 0;
            STATE.gameOverState = false;
            STATE.shipHp = 100;
            STATE.shipHitFlash = 0;
            STATE.gameMode = 'shooting';
            laser.cleanupLaserLevel();
            laser._initialized = false;
            STATE.leftHandGunEnabled = false;
            STATE.ak48Attached = false;
            STATE.ak48LeftAttached = false;
            STATE.ak48Mesh = null;
            STATE.gunRecoilPos = 0;
            STATE.gunRecoilRot = 0;
            STATE.choiceCardsActive = false;
            STATE.choiceRefreshCount = 0;
            game.resetBuddhaPalm();
            STATE.buddhaPalmReady = false;
            STATE.buddhaPalmUnlocked = false;
            STATE.transitionCloudActive = false;
            STATE.transitionCloudPhase = 0;
            STATE.nextWaveTimer = 0;
            game.initTransitionClouds();
            selectedLevel = 0;
            if (STATE.choiceCardTimeout) { clearTimeout(STATE.choiceCardTimeout); STATE.choiceCardTimeout = null; }
            // 清除选择卡
            while (choiceCardGroup.children.length > 0) {
                const child = choiceCardGroup.children[0];
                if (child.material && child.material.map) child.material.map.dispose();
                if (child.material) child.material.dispose();
                if (child.geometry) child.geometry.dispose();
                choiceCardGroup.remove(child);
            }
        });

        window.addEventListener('beforeunload', () => {
            renderer.dispose();
            scene.traverse(obj => {
                if (obj.geometry) obj.geometry.dispose();
                if (obj.material) {
                    if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
                    else obj.material.dispose();
                }
            });
        });

        initScene();
        window.__log('initScene() 完成', 's');

        // ===== 日志面板更新 =====
        let _lastLogRender = 0;
        function renderLogPanel() {
            const buf = window.__logBuffer || [];
            if (buf.length === 0) return;
            const now = Date.now();
            const newEntries = buf.slice(_lastLogRender);
            _lastLogRender = buf.length;
            let html = '';
            // 始终从最近的 200 条显示
            const start = Math.max(0, buf.length - 200);
            for (let i = start; i < buf.length; i++) {
                const e = buf[i];
                const t = new Date(e.time);
                const ts = t.toTimeString().slice(0, 8);
                html += `<span class="log-time">[${ts}]</span> <span class="log-${e.level}">${e.msg}</span>\n`;
            }
            logPanel.innerHTML = html;
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        // 独立于 Three.js 循环的日志刷新（每 200ms）
        setInterval(renderLogPanel, 200);
        // 同时也在 animate 中触发
        window.__animateLogFlag = function() { renderLogPanel(); };
    </script>
</body>
</html>
