<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>VR 热气球托盘场景 - Ak48压缩版</title>
    <style>
        :root { --bg: #1a1a2e; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg); overflow: hidden;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            height: 100vh; width: 100vw;
            user-select: none; -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        canvas { display: block; }
        
        #vr-entry { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 20; }
        #enter-vr-btn {
            display: block; padding: 16px 44px; font-size: 20px; font-weight: 700;
            letter-spacing: 2px; color: #fff;
            background: linear-gradient(135deg, #e94560, #c23152);
            border: none; border-radius: 50px; cursor: pointer;
            transition: all 0.3s ease; box-shadow: 0 8px 30px rgba(233,69,96,0.5);
            text-transform: uppercase; outline: none;
        }
        #enter-vr-btn:hover { background: linear-gradient(135deg, #ff5a7a, #e94560); transform: translateY(-3px); }
        #enter-vr-btn:active { transform: scale(0.96); }
        #enter-vr-btn:disabled { background: #555; box-shadow: none; cursor: not-allowed; opacity: 0.6; }
        
        #vr-hints {
            position: fixed; bottom: 130px; left: 50%; transform: translateX(-50%);
            z-index: 15; pointer-events: none; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center;
        }
        .hint-badge {
            background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
            border-radius: 20px; padding: 8px 18px; color: #fff; font-size: 13px;
            letter-spacing: 1px; white-space: nowrap;
        }
        .hint-badge .key { font-weight: 700; color: #ffd700; }
        
        #status-msg {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
            z-index: 30; color: #fff; font-size: 18px; text-align: center;
            background: rgba(0,0,0,0.75); padding: 20px 30px;
            border-radius: 16px; display: none;
        }
        #status-msg.error { background: rgba(180,30,30,0.85); display: block; }
        
        #loading {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
            color: #fff; font-size: 20px; z-index: 100;
            display: flex; flex-direction: column; align-items: center; gap: 12px;
        }
        #loading-spinner {
            width: 48px; height: 48px; border: 4px solid rgba(255,255,255,0.2);
            border-top-color: #fff; border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loading">
        <div id="loading-spinner"></div>
        <div>加载中...</div>
    </div>
    <div id="vr-entry"><button id="enter-vr-btn">🎈 进入VR场景</button></div>
    <div id="vr-hints">
        <span class="hint-badge">🔫 <span class="key">扳机</span> 射击</span>
        <span class="hint-badge">🕹️ <span class="key">摇杆</span> 移动</span>
        <span class="hint-badge">🅰️ <span class="key">A键</span> 退出</span>
    </div>
    <div id="status-msg"></div>

    <!-- 本地文件，HTTP 服务器即可，PICO 浏览器无需访问任何外部网络 -->
    <script type="importmap">
        {
            "imports": {
                "three": "./three.module.js",
                "three/addons/": "./jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

        // DOM 元素
        const enterVRBtn = document.getElementById('enter-vr-btn');
        const statusMsgEl = document.getElementById('status-msg');
        const vrHintsEl = document.getElementById('vr-hints');
        const vrEntryEl = document.getElementById('vr-entry');
        const loadingEl = document.getElementById('loading');

        // -------------------- 加载状态管理 --------------------
        const loadingResources = { texture: false, model: false };
        let loadingHidden = false;

        function checkAllLoaded(msg) {
            if (loadingHidden) return;
            if (msg) {
                loadingEl.innerHTML = '<div style="color:#ffaa00;">' + msg + '</div>';
                setTimeout(() => { loadingEl.style.display = 'none'; loadingHidden = true; }, 1500);
                return;
            }
            if (loadingResources.texture && loadingResources.model) {
                loadingHidden = true;
                loadingEl.style.display = 'none';
            }
        }

        function onResourceError(msg) {
            loadingEl.innerHTML = '<div style="color:#ffaa00;">' + msg + '</div>';
            setTimeout(() => { loadingEl.style.display = 'none'; loadingHidden = true; }, 2000);
        }

        // 最长等待 15 秒后强制关闭
        setTimeout(() => {
            if (!loadingHidden) onResourceError('⚠️ 加载超时，检查 HTTP 服务器是否运行中...');
        }, 15000);

        // 摇杆和输入状态
        const rightInput = { stickX: 0, stickY: 0 };
        const leftInput = { stickX: 0, stickY: 0 };

        // 云海滚动速度（由摇杆控制）
        const cloudScroll = { x: 0, y: 0 };

        const MOVE_SPEED = 3.5;
        const DEADZONE = 0.2;
        const SHOOT_COOLDOWN = 150; // 射击冷却时间(ms)

        // ==================== 音效系统（Web Audio API） ====================
        let audioCtx = null;

        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playShootSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'square';
            osc.frequency.setValueAtTime(220, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(55, audioCtx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + 0.08);
        }

        function playBalloonPopSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + 0.15);
        }

        // Three.js 核心
        const renderer = new THREE.WebGLRenderer({ antialias: false }); // VR头显自带反锯齿，关闭省GPU
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.0)); // 限制1.0，移动端降采样
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;

        // VR 模式下关闭阴影（移动 GPU 瓶颈优化）
        function setShadow(enabled) {
            renderer.shadowMap.enabled = enabled;
            sunLight.castShadow = enabled;
            if (!enabled) {
                // VR 时直接关闭所有阴影投射，避免额外的深度图 pass
                scene.traverse(obj => {
                    if (obj.isMesh) obj.castShadow = false;
                });
            } else {
                // 恢复
                sunLight.castShadow = true;
                scene.traverse(obj => {
                    if (obj.isMesh && (obj === ak48Model || obj.parent === ak48Model)) {
                        // 不处理
                    }
                });
            }
        }
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.NoToneMapping; // 关闭色调映射，ACES最影响移动GPU
        renderer.xr.enabled = true;
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 30, 100);

        // 渲染器清除色与背景一致，避免快速转头时边缘露出黑色
        renderer.setClearColor(new THREE.Color(0x87CEEB));

        const camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.1, 200);
        camera.position.set(0, 1.6, 0);
        const dolly = new THREE.Group();
        dolly.add(camera);
        scene.add(dolly);

        // 天空穹顶（半球），跟随相机移动，转头再快也不会露出黑边
        function createSkyDome() {
            // SphereGeometry: phiLength=PI 整球，thetaLength=PI/2 则只显示上半球（天空）
            const skyGeo = new THREE.SphereGeometry(60, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2);
            const skyMat = new THREE.MeshBasicMaterial({
                color: 0x87CEEB,
                side: THREE.BackSide,
                depthWrite: false
            });
            const sky = new THREE.Mesh(skyGeo, skyMat);
            // 穹顶底部对齐玩家眼高，完整包裹头顶和四周
            sky.position.y = 1.6;
            return sky;
        }
        dolly.add(createSkyDome()); // 随玩家移动，完全填满 VR 全视角

        // 光照
        scene.add(new THREE.AmbientLight(0xffeedd, 1.2));
        const sunLight = new THREE.DirectionalLight(0xffffff, 2.5);
        sunLight.position.set(20, 40, 10);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 100;
        sunLight.shadow.camera.left = -30;
        sunLight.shadow.camera.right = 30;
        sunLight.shadow.camera.top = 30;
        sunLight.shadow.camera.bottom = -30;
        scene.add(sunLight);
        scene.add(new THREE.HemisphereLight(0x87CEEB, 0x90EE90, 0.8));

        // ==================== 子弹系统配置 ====================
        /*  子弹参数速查表（修改下方数值即可调整）
            --------------------------------------------------
            发射口位置(相对于右手控制器):  muzzleLocal (0, 0, -0.2)
                                           X=0      左右偏移
                                           Y=0      上下偏移
                                           Z=-0.2   前后偏移（负=前方）
            --------------------------------------------------
            子弹大小:                      SphereGeometry(0.03, 8, 8)
                                           0.03 = 半径（米）
            --------------------------------------------------
            子弹颜色:                      color: 0xffaa00 (橙黄)
                                           emissive: 0xff4400 (发光橙红)
                                           emissiveIntensity: 0.8 (发光强度)
            --------------------------------------------------
            子弹速度:                      BULLET_SPEED = 15 (米/秒)
            --------------------------------------------------
            子弹寿命:                      BULLET_LIFE = 3 (秒)
            --------------------------------------------------
            射击冷却:                      SHOOT_COOLDOWN = 150 (毫秒，见上方)
            --------------------------------------------------
        */
        const bullets = [];
        const bulletGroup = new THREE.Group();
        scene.add(bulletGroup);
        const BULLET_SPEED = 15;   // <-- 子弹飞行速度（米/秒）
        const BULLET_LIFE = 2;     // <-- 子弹存活时间（秒）

        // ==================== 子弹对象池（消除 GC） ====================
        const BULLET_POOL_SIZE = 20;
        const sharedBulletGeom = new THREE.SphereGeometry(0.02, 8, 8);
        const sharedBulletMat = new THREE.MeshStandardMaterial({
            color: 0xffaa00,
            emissive: 0xff4400,
            emissiveIntensity: 0.8
        });
        const bulletPool = [];

        function initBulletPool() {
            for (let i = 0; i < BULLET_POOL_SIZE; i++) {
                const mesh = new THREE.Mesh(sharedBulletGeom, sharedBulletMat);
                mesh.userData = { active: false, vel: new THREE.Vector3(), life: 0 };
                mesh.visible = false;
                bulletGroup.add(mesh);
                bulletPool.push(mesh);
            }
        }
        initBulletPool();

        function acquireBullet() {
            for (let i = 0; i < bulletPool.length; i++) {
                if (!bulletPool[i].userData.active) return bulletPool[i];
            }
            return null; // 池已满
        }

        // ==================== 子弹发射角度标注区 ====================
        /*  如需修改子弹发射角度，在下方 shootBullet 中修改：
            --------------------------------------------------
            发射口位置(相对于右手控制器本地坐标):
                muzzleLocal = (0, 0, -0.2)
                X=0      左右偏移（米）
                Y=0      上下偏移（米）
                Z=-0.2   前后偏移（负=前方，米）
            --------------------------------------------------
            方向计算:
                dir = (0, 0, -1) 应用控制器的旋转(quat)
                = 沿控制器 Z 轴负方向（正前方）
            --------------------------------------------------
            【修改角度示例】在 dir 计算后添加以下代码：

            // 固定俯仰偏移（抬头/低头）
            const bulletPitch = -30 * Math.PI / 180;  // <-- -15度，负=低头
            const aimQuat = new THREE.Quaternion();
            aimQuat.setFromEuler(new THREE.Euler(bulletPitch, 0, 0));
            dir.applyQuaternion(aimQuat);

            // 或固定偏航偏移（左右摆动）
            const bulletYaw = 5 * Math.PI / 180;  // <-- +5度，正=左偏
            const aimQuat = new THREE.Quaternion();
            aimQuat.setFromEuler(new THREE.Euler(0, bulletYaw, 0));
            dir.applyQuaternion(aimQuat);

            // 或同时修改俯仰+偏航
            const aimQuat = new THREE.Quaternion();
            aimQuat.setFromEuler(new THREE.Euler(bulletPitch, bulletYaw, 0));
            dir.applyQuaternion(aimQuat);
            --------------------------------------------------
        */
        function shootBullet(controller) {
            const bullet = acquireBullet();
            if (!bullet) return; // 池已满，跳过本次射击

            initAudio(); // 用户首次射击时初始化 AudioContext
            playShootSound();

            // 发射口在控制器本地坐标系中的位置（修改这里调整子弹出膛位置）
            const muzzleLocal = new THREE.Vector3(0, 0, -0.2);
            const origin = muzzleLocal.clone().applyMatrix4(controller.matrixWorld);
            const quat = controller.getWorldQuaternion(new THREE.Quaternion());

            // ── 俯仰偏移在控制器本地坐标系中计算，避免水平转动时角度串扰 ──
            // 先在本地空间构造俯仰四元数，再与控制器世界朝向合成
            const bulletPitch = -30 * Math.PI / 180; // 负=向下低头（修改此处）
            const localPitchQuat = new THREE.Quaternion().setFromEuler(
                new THREE.Euler(bulletPitch, 0, 0)
            );
            // 合成：先控制器旋转，再本地俯仰 → 方向始终相对枪管轴
            const finalQuat = quat.clone().multiply(localPitchQuat);
            const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(finalQuat);

            bullet.position.copy(origin);
            bullet.userData.active = true;
            bullet.userData.vel.copy(dir.normalize().multiplyScalar(BULLET_SPEED));
            bullet.userData.life = BULLET_LIFE;
            bullet.visible = true;
            bullets.push(bullet);
        }

        function updateBullets(dt) {
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.position.x += b.userData.vel.x * dt;
                b.position.y += b.userData.vel.y * dt;
                b.position.z += b.userData.vel.z * dt;
                b.userData.life -= dt;

                // 超出范围或生命结束则回池
                if (b.userData.life <= 0 || b.position.y < 0 || b.position.y > 30) {
                    b.userData.active = false;
                    b.visible = false;
                    bullets.splice(i, 1);
                }
            }
        }

        // ==================== 气球战斗系统配置 ====================
        /*  气球参数速查表（修改下方数值即可调整）
            --------------------------------------------------
            气球数量:                      BALLOON_COUNT = 10
            --------------------------------------------------
            气球生命值:                    BALLOON_HP = 100
            --------------------------------------------------
            气球移动速度:                  BALLOON_SPEED = 1.0 (米/秒)
            --------------------------------------------------
            生成距离:                      BALLOON_SPAWN_RADIUS = 10 (米)
                                           玩家初始位置方圆10米外
            --------------------------------------------------
            气球半径:                      BALLOON_RADIUS = 0.5 (米)
            --------------------------------------------------
            打破气球得分:                  BALLOON_SCORE = 10
            --------------------------------------------------
            子弹伤害:                      BULLET_DAMAGE = 30 (每发)
            --------------------------------------------------
        */
        const balloons = [];
        const balloonGroup = new THREE.Group();
        scene.add(balloonGroup);
        const BALLOON_SPEED = 0.5;         // <-- 气球移动速度（米/秒）
        const BALLOON_SPAWN_RADIUS = 15;  // <-- 生成距离玩家半径（米）
        const BALLOON_COUNT = 10;          // <-- 气球数量
        const BALLOON_HP = 100;            // <-- 气球生命值
        const BALLOON_SCORE = 10;          // <-- 打破气球得分
        const BALLOON_RADIUS = 0.5;        // <-- 气球半径（米）
        const BULLET_DAMAGE = 30;          // <-- 子弹伤害
        const BALLOON_COLORS = [0xff4444, 0x44ff44, 0x4444ff, 0xffff44, 0xff44ff, 0xff88ff, 0x88ffff];

        function createBalloon(x, y, z) {
            const geom = new THREE.SphereGeometry(BALLOON_RADIUS, 8, 8); // 8x8降低三角面，视觉差距小
            const color = BALLOON_COLORS[Math.floor(Math.random() * BALLOON_COLORS.length)];
            const mat = new THREE.MeshStandardMaterial({
                color: color,
                roughness: 0.3,
                metalness: 0.1,
                emissive: color,
                emissiveIntensity: 0.1
            });
            const balloon = new THREE.Mesh(geom, mat);
            balloon.position.set(x, y, z);
            balloon.castShadow = true;
            balloon.userData = { active: true, hp: BALLOON_HP, maxHp: BALLOON_HP };
            balloonGroup.add(balloon);
            balloons.push(balloon);
            return balloon;
        }

        function spawnBalloons() {
            // 清除旧气球
            balloons.forEach(b => {
                b.geometry.dispose();
                b.material.dispose();
                balloonGroup.remove(b);
            });
            balloons.length = 0;

            // 在玩家初始位置方圆10米外生成10个气球
            const playerPos = dolly.position.clone();
            for (let i = 0; i < BALLOON_COUNT; i++) {
                const angle = (Math.PI * 2 / BALLOON_COUNT) * i + Math.random() * 0.5;
                const r = BALLOON_SPAWN_RADIUS + Math.random() * 3;
                const x = playerPos.x + Math.cos(angle) * r;
                const z = playerPos.z + Math.sin(angle) * r;
                const y = 1.5 + Math.random() * 3; // 高度 1.5~4.5米
                createBalloon(x, y, z);
            }
        }

        function updateBalloons(dt) {
            const playerPos = dolly.position.clone();
            playerPos.y += 1.6; // 对准玩家头部高度

            for (let i = balloons.length - 1; i >= 0; i--) {
                const b = balloons[i];
                if (!b.userData.active) continue;

                // 向玩家移动
                const dir = new THREE.Vector3().subVectors(playerPos, b.position).normalize();
                b.position.x += dir.x * BALLOON_SPEED * dt;
                b.position.y += dir.y * BALLOON_SPEED * dt;
                b.position.z += dir.z * BALLOON_SPEED * dt;

                // 漂浮动画
                b.position.y += Math.sin(performance.now() * 0.003 + i) * 0.002;
            }
        }

        function checkBulletBalloonCollisions() {
            for (let i = bullets.length - 1; i >= 0; i--) {
                const bullet = bullets[i];
                for (let j = balloons.length - 1; j >= 0; j--) {
                    const balloon = balloons[j];
                    if (!balloon.userData.active) continue;

                    const dist = bullet.position.distanceTo(balloon.position);
                    if (dist < BALLOON_RADIUS + 0.05) {
                        // 气球受伤（使用玩家当前攻击力）
                        balloon.userData.hp -= playerStats.atk;

                        // 击中效果：闪烁
                        balloon.material.emissiveIntensity = 0.5;
                        setTimeout(() => {
                            if (balloon.userData) balloon.material.emissiveIntensity = 0.1;
                        }, 100);

                        // 检查气球是否被打破
                        if (balloon.userData.hp <= 0) {
                            balloon.userData.active = false;
                            balloon.visible = false;
                            playerStats.score += BALLOON_SCORE;
                            playBalloonPopSound();
                        }
                        // 子弹碰一次就销毁（不再穿透），避免同一发子弹在气球内部多帧重复扣血
                        bullet.userData.active = false;
                        bullet.visible = false;
                        bullets.splice(i, 1);

                        // 检查是否所有气球都被打破
                        checkAllBalloonsDestroyed();
                        break; // 子弹已销毁，直接跳出内层循环
                    }
                }
            }
        }

        function checkAllBalloonsDestroyed() {
            const activeBalloons = balloons.filter(b => b.userData.active);
            if (activeBalloons.length === 0 && !choiceCardsActive) {
                // 所有气球都被打破，弹出选择卡
                spawnChoiceCards();
            }
        }

        // ==================== 选择卡系统配置 ====================
        /*  选择卡参数速查表（修改下方数值即可调整）
            --------------------------------------------------
            选择卡距离玩家:                CHOICE_CARD_DISTANCE = 2.5 (米)
            --------------------------------------------------
            选择卡尺寸:                    宽 0.5米, 高 0.3米
            --------------------------------------------------
            选择卡存在时间:                10秒（超时自动消失）
            --------------------------------------------------
            选择卡效果:
                [0] 生命值+100
                [1] 攻击力+20
                [2] 射击额外发射一颗子弹
            --------------------------------------------------
        */
        let choiceCardsActive = false;
        let extraBulletEnabled = false; // 是否启用额外子弹
        const choiceCardGroup = new THREE.Group();
        scene.add(choiceCardGroup);
        const CHOICE_CARD_DISTANCE = 0.8; // <-- 选择卡距离玩家（米）

        const choiceOptions = [
            { 
                label: '生命值+100', 
                color: { r: 255, g: 60, b: 60 },
                effect: () => {

        function spawnChoiceCards() {
            if (choiceCardsActive) return;
            choiceCardsActive = true;

            // 清除旧选择卡
            while (choiceCardGroup.children.length > 0) {
                const child = choiceCardGroup.children[0];
                if (child.material.map) child.material.map.dispose();
                child.material.dispose();
                child.geometry.dispose();
                choiceCardGroup.remove(child);
            }

            // 在玩家面前生成三个选择卡
            const cameraPos = new THREE.Vector3();
            camera.getWorldPosition(cameraPos);
            const cameraDir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);

            // 选择卡基础位置：玩家前方
            const basePos = cameraPos.clone().add(cameraDir.clone().multiplyScalar(CHOICE_CARD_DISTANCE));
            basePos.y = 1.2; // 固定高度

            // 计算相机右方向（用于横向排列卡片）
            const cameraRight = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
            cameraRight.y = 0;
            cameraRight.normalize();

            for (let i = 0; i < 3; i++) {
                const card = createChoiceCard(choiceOptions[i], 0); // xOffset 不再用于本地偏移

        function createCartoonCloudTexture(size = 512, cloudCount = 25) {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, size, size);

            function drawCloud(cx, cy, baseR) {
                const parts = [
                    [0, 0, baseR],
                    [-baseR * 0.7, -baseR * 0.3, baseR * 0.8],
                    [baseR * 0.7, -baseR * 0.3, baseR * 0.9],
                    [-baseR * 0.4, -baseR * 0.7, baseR * 0.7],
                    [baseR * 0.4, -baseR * 0.7, baseR * 0.75],
                    [0, -baseR * 0.9, baseR * 0.7],
                ];
                ctx.fillStyle = '#000000';
                parts.forEach(([dx, dy, r]) => {
                    ctx.beginPath();
                    ctx.arc(cx + dx, cy + dy, r + 2, 0, Math.PI * 2);
                    ctx.fill();
                });
                ctx.fillStyle = '#ffffff';
                parts.forEach(([dx, dy, r]) => {
                    ctx.beginPath();
                    ctx.arc(cx + dx, cy + dy, r, 0, Math.PI * 2);
                    ctx.fill();
                });
            }

            const margin = size * 0.1;
            for (let i = 0; i < cloudCount; i++) {
                const cx = margin + Math.random() * (size - margin * 2);
                const cy = margin + Math.random() * (size - margin * 2);
                const r = size * 0.04 + Math.random() * size * 0.06;
                drawCloud(cx, cy, r);
            }
            return new THREE.CanvasTexture(canvas);
        }

            const mesh = new THREE.Mesh(geometry, material);
            mesh.rotation.x = -Math.PI / 2;
            mesh.position.y = y;

            return mesh;
        }

        function roundRect(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();

            forward.y = 0; forward.normalize();
            const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
            right.y = 0; right.normalize();

            // 摇杆控制云海滚动方向和速度（摇杆前推 = 云向身后流 = 向前飞的错觉）
            const intensity = Math.max(Math.abs(sx), Math.abs(sy));
            const scrollSpeed = 2.0 * intensity;
            cloudScroll.x = (forward.x * sy + right.x * sx) * scrollSpeed;
            cloudScroll.y = (forward.z * sy + right.z * sx) * scrollSpeed;
        }

        function handleExit() {
            const session = renderer.xr.getSession();
            if (!session) return;
            if (!session.inputSources) return;
            for (const src of session.inputSources) {
                if (!src.gamepad) continue;
                if (src.handedness === 'right') {
                    const btnA = src.gamepad.buttons[4]?.pressed;
                    const btnB = src.gamepad.buttons[5]?.pressed;
                    if (btnA || btnB) { session.end(); break; }
                }
            }
        }

        // -------------------- 动画循环 --------------------
        const clock = new THREE.Clock();
        const tempPos = new THREE.Vector3();

        function updateCloudLayers(dt) {
            camera.getWorldPosition(tempPos);
            cloudLayers.forEach((layer, idx) => {
                // 云海平滑跟随相机，但允许有轻微的滞后感
                layer.position.x += (tempPos.x - layer.position.x) * 0.05;
                layer.position.z += (tempPos.z - layer.position.z) * 0.05;

                const tex = layer.userData.texture;
                // 摇杆控制纹理滚动：不同层速度不同形成视差
                const parallax = idx === 0 ? 1.0 : 0.6;
                tex.offset.x += cloudScroll.x * dt * parallax;
                tex.offset.y += cloudScroll.y * dt * parallax;
            });
        }

        let gameStarted = false;

        function animate() {
            const dt = Math.min(clock.getDelta(), 0.1);

            if (renderer.xr.isPresenting) {
                updateInputs();
                handleMovement(dt);
                handleShooting();
                updateBullets(dt);
                updateBalloons(dt);
                checkBulletBalloonCollisions();
                checkLeftHandChoiceCardCollision();
                handleExit();
                // 调试面板每5帧更新一次（Canvas重绘+GPU纹理上传较重）
                if (!animate._frameCount) animate._frameCount = 0;
                animate._frameCount++;
                if (animate._frameCount % 5 === 0) {
                    updateDebugPanel();
                    updateLeftDebugPanel();
                }
                updateCloudLayers(dt);
                vrEntryEl.style.display = 'none';
                vrHintsEl.style.display = 'none';
            } else {
                updateCloudLayers(dt);
                vrEntryEl.style.display = 'block';
                vrHintsEl.style.display = 'flex';
            }

            renderer.render(scene, camera);
        }
        renderer.setAnimationLoop(animate);

        // -------------------- 初始化 --------------------
        async function initScene() {
            setupController(0);
            setupController(1);

            // 进入 VR 核心函数
            async function enterVR() {
                if (enterVRBtn.disabled) return;
                enterVRBtn.disabled = true;
                enterVRBtn.textContent = '⏳ 启动中...';
                try {
                    if (!navigator.xr) {
                        throw new Error('浏览器不支持 WebXR');
                    }
                    
                    let session;
                    try {
                        if (navigator.xr.isSessionSupported) {
                            const supported = await navigator.xr.isSessionSupported('immersive-vr');
                            if (!supported) throw new Error('设备不支持VR');
                        }
                        session = await navigator.xr.requestSession('immersive-vr', {
                            requiredFeatures: ['local-floor']
                        });
                    } catch (e) {
                        console.log('使用 PICO 兼容模式:', e.message);
                        session = await navigator.xr.requestSession('immersive-vr');
                    }
                    
                    renderer.xr.setSession(session);
                    enterVRBtn.disabled = false;
                    enterVRBtn.textContent = '🎈 进入VR场景';
                } catch (err) {
                    statusMsgEl.innerHTML = '❌ ' + err.message;
                    statusMsgEl.classList.add('error');
                    enterVRBtn.disabled = false;
                    enterVRBtn.textContent = '🎈 进入VR场景';
                }
            }

            // 按钮点击进入 VR
            enterVRBtn.onclick = enterVR;
            // 点击页面任意位置也能进入 VR
            document.body.onclick = enterVR;
            document.body.ontouchstart = enterVR;

            renderer.xr.addEventListener('sessionend', () => {
                setShadow(true); // 退出 VR 恢复阴影
                enterVRBtn.disabled = false;
                vrEntryEl.style.display = 'block';
                vrHintsEl.style.display = 'flex';
                statusMsgEl.style.display = 'none';
            });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            // 页面卸载时清理资源
            window.addEventListener('beforeunload', () => {
                renderer.dispose();
                scene.traverse(obj => {
                    if (obj.geometry) obj.geometry.dispose();
                    if (obj.material) {
                        if (Array.isArray(obj.material)) {
                            obj.material.forEach(m => m.dispose());
                        } else {
                            obj.material.dispose();
                        }
                    }
                });
                cloudLayers.forEach(layer => {
                    if (layer.userData.texture) layer.userData.texture.dispose();
                    if (layer.material) layer.material.dispose();
                    if (layer.geometry) layer.geometry.dispose();
                });
                dracoLoader.dispose();
            });
        }

        initScene();
    </script>
</body>
</html>
